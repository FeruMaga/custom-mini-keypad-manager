[package]
name = "custom-keypad-manager"
version = "0.1.0"
description = "Desktop manager for configuring a 6-key USB HID mini keypad with a rotary dial."
authors = ["Custom Mini Keypad Manager contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
